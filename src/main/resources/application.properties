spring.application.name=novabank-notification-service

server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/novabank_notification
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true

#eureka discovery config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true

#Kafka as consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group

#when a service is down when up events that come when is down will be processed
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDesirilizer

spring.kafka.consumer.properties.spring.json.type.mapping=\
  iki.novabank_user_account_service.kafka.dto.UserRegistrationEvent:iki.novabank_notification_service.kafka.dto.UserRegistrationEvent


